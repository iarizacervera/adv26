<head>

<body>
<!--CUERPO-->
<canvas id="nieve" aria-hidden="true"></canvas>
<main id="inicio" class="wrap">
  <header class="top">
    <span class="eyebrow" id="ano">Diciembre</span>
    <h1>Nuestro Adviento</h1>
    <span class="aviso" id="aviso" hidden></span>
  </header>
  <section id="hoy" aria-label="Hoy"></section>
  <section class="grid" id="sobres" aria-label="Los 24 sobres"></section>
  <p class="pie">Cada sobre se abre a medianoche, hora de Madrid.</p>
</main>
<div id="dia" class="dayview" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="contenido.js"></script>
<script src="app.js"></script>
